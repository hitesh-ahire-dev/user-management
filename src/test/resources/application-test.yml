# Test profile: in-memory H2 (MySQL compatibility mode) for fast slice tests.
spring:
  datasource:
    url: jdbc:h2:mem:user_management_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

logging:
  level:
    com.example.usermanagement: INFO
