# ---------------------------------------------------------------------------
# RAILWAY profile — used when SPRING_PROFILES_ACTIVE=railway on Railway.com.
#
# Railway's MySQL service automatically injects these environment variables
# into every service in the same project:
#   MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
#
# Railway also injects PORT — the port your app must listen on.
# ---------------------------------------------------------------------------
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.example.usermanagement: INFO
