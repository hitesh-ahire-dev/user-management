# ---------------------------------------------------------------------------
# LOCAL profile: run the app from your IDE / `mvn spring-boot:run`
# against a MySQL instance on your machine.
#
# Credentials are read from environment variables so nothing is hardcoded.
# Sensible localhost defaults are provided for convenience while learning.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # "update" is convenient for local learning. For production use Flyway
      # migrations with ddl-auto=validate (explained in the README).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.example.usermanagement: DEBUG
