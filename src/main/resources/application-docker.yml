# ---------------------------------------------------------------------------
# DOCKER profile: used when the app runs inside a container via docker-compose.
# The DB host is the compose service name ("mysql"), not localhost.
# All credentials come from environment variables injected by docker-compose.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.example.usermanagement: INFO
